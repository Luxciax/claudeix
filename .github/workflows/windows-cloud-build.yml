name: Windows Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - cloud-build/0.2.3

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build Windows app and installers
        run: pnpm exec tauri build --bundles nsis,msi

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Claudeix-windows-exe
          path: src-tauri/target/release/claudeix.exe
          if-no-files-found: error

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Claudeix-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
