[package]
name = "claudeix"
version = "0.1.2"
description = "Claude Code desktop session manager"
authors = ["Luxciax"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "claudeix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
sha2 = "0.10"
sysinfo = "0.30"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
